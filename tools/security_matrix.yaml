# Security matrix (architecture 4.1, 4.3, 4.4; read by tools/check_security_matrix.py).
# ACL perms are "RWCD" digits; rule perms are read/write/create/unlink digits.
# Group aliases: user = group_woow_document_user, manager = group_woow_document_manager,
# portal = base.group_portal. A rule with groups [] is global.
# The portal W=1 on woow.document.folder is a probe only (HD-07): its CSV row must say HD-07.
version: 1
aliases:
  user: group_woow_document_user
  manager: group_woow_document_manager
  portal: base.group_portal
groups:
  group_woow_document_user: {category: module_category_woow_document, implied: [base.group_user]}
  group_woow_document_manager: {category: module_category_woow_document, implied: [group_woow_document_user]}
  group_woow_document_attachment_overview: {category: null, implied: [base.group_user]}
categories: [module_category_woow_document]
company_models: [woow.document.folder, woow.document.folder.access, woow.document, woow.document.tag, woow.document.share, woow.document.log]
acl:
  woow.document.folder: {user: '1110', manager: '1111', portal: '1100'}
  woow.document.folder.access: {user: '1111', manager: '1111'}
  woow.document: {user: '1110', manager: '1111', portal: '1010'}
  woow.document.tag: {user: '1010', manager: '1111'}
  woow.document.share: {user: '1110', manager: '1111'}
  woow.document.log: {user: '1000', manager: '1000'}
  woow.document.share.wizard: {user: '1110', manager: '1110'}
  woow.document.move.wizard: {user: '1110', manager: '1110'}
  woow.document.restore.wizard: {user: '1110', manager: '1110'}
  woow.document.purge.wizard: {user: '1110', manager: '1110'}
  woow.document.add.attachment.wizard: {user: '1110', manager: '1110'}
  woow.document.notify.wizard: {user: '1110', manager: '1110'}
hd07: [woow.document.folder, portal]
rules:
- id: rule_woow_document_folder_company
  ref: R-F0
  model: woow.document.folder
  groups: []
  perms: '1111'
  domain: "['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]"
- id: rule_woow_document_folder_user_read
  ref: R-F1
  model: woow.document.folder
  groups: [user]
  perms: '1000'
  domain: "['|', '&', ('in_trash', '=', False), '|', ('eff_read_user_ids', 'in', [user.id]), ('eff_read_group_ids', 'in', user.groups_id.ids), '|', ('eff_edit_user_ids', 'in', [user.id]), ('eff_edit_group_ids', 'in', user.groups_id.ids)]"
- id: rule_woow_document_folder_user_write
  ref: R-F2
  model: woow.document.folder
  groups: [user]
  perms: '0100'
  domain: "['|', ('eff_edit_user_ids', 'in', [user.id]), ('eff_edit_group_ids', 'in', user.groups_id.ids)]"
- id: rule_woow_document_folder_user_create
  ref: R-F3
  model: woow.document.folder
  groups: [user]
  perms: '0010'
  domain: "['|', ('parent_id', '=', False), ('parent_id', 'any', ['&', ('in_trash', '=', False), '|', ('eff_edit_user_ids', 'in', [user.id]), ('eff_edit_group_ids', 'in', user.groups_id.ids)])]"
- id: rule_woow_document_folder_manager
  ref: R-F4
  model: woow.document.folder
  groups: [manager]
  perms: '1111'
  domain: "[(1, '=', 1)]"
- id: rule_woow_document_folder_portal_read
  ref: R-F5
  model: woow.document.folder
  groups: [portal]
  perms: '1000'
  domain: "[('in_trash', '=', False), ('eff_read_partner_ids', 'in', [user.partner_id.id])]"
- id: rule_woow_document_folder_portal_write
  ref: R-F6
  model: woow.document.folder
  groups: [portal]
  perms: '0100'
  domain: "[('in_trash', '=', False), ('eff_upload_partner_ids', 'in', [user.partner_id.id])]"
- id: rule_woow_document_folder_access_company
  ref: R-A0
  model: woow.document.folder.access
  groups: []
  perms: '1111'
  domain: "['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]"
- id: rule_woow_document_folder_access_user_read
  ref: R-A1
  model: woow.document.folder.access
  groups: [user]
  perms: '1000'
  domain: "[('folder_id', 'any', ['|', '&', ('in_trash', '=', False), '|', ('eff_read_user_ids', 'in', [user.id]), ('eff_read_group_ids', 'in', user.groups_id.ids), '|', ('eff_edit_user_ids', 'in', [user.id]), ('eff_edit_group_ids', 'in', user.groups_id.ids)])]"
- id: rule_woow_document_folder_access_user_manage
  ref: R-A2
  model: woow.document.folder.access
  groups: [user]
  perms: '0111'
  domain: "[('folder_id', 'any', ['|', ('eff_manage_user_ids', 'in', [user.id]), ('eff_manage_group_ids', 'in', user.groups_id.ids)])]"
- id: rule_woow_document_folder_access_manager
  ref: R-A3
  model: woow.document.folder.access
  groups: [manager]
  perms: '1111'
  domain: "[(1, '=', 1)]"
- id: rule_woow_document_company
  ref: R-D0
  model: woow.document
  groups: []
  perms: '1111'
  domain: "['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]"
- id: rule_woow_document_user_read
  ref: R-D1
  model: woow.document
  groups: [user]
  perms: '1000'
  domain: "['&', ('folder_in_trash', '=', False), '|', '&', ('active', '=', True), '|', '|', ('folder_id', 'any', ['|', ('eff_read_user_ids', 'in', [user.id]), ('eff_read_group_ids', 'in', user.groups_id.ids)]), ('shared_user_ids', 'in', [user.id]), '&', ('owner_id', '=', user.id), ('folder_id', 'any', ['|', ('eff_upload_user_ids', 'in', [user.id]), ('eff_upload_group_ids', 'in', user.groups_id.ids)]), '|', ('folder_id', 'any', ['|', ('eff_edit_user_ids', 'in', [user.id]), ('eff_edit_group_ids', 'in', user.groups_id.ids)]), '&', ('owner_id', '=', user.id), ('folder_id', 'any', ['|', ('eff_upload_user_ids', 'in', [user.id]), ('eff_upload_group_ids', 'in', user.groups_id.ids)])]"
- id: rule_woow_document_user_write
  ref: R-D2
  model: woow.document
  groups: [user]
  perms: '0100'
  domain: "['&', ('folder_in_trash', '=', False), '|', ('folder_id', 'any', ['|', ('eff_edit_user_ids', 'in', [user.id]), ('eff_edit_group_ids', 'in', user.groups_id.ids)]), '&', ('owner_id', '=', user.id), ('folder_id', 'any', ['|', ('eff_upload_user_ids', 'in', [user.id]), ('eff_upload_group_ids', 'in', user.groups_id.ids)])]"
- id: rule_woow_document_user_create
  ref: R-D3
  model: woow.document
  groups: [user]
  perms: '0010'
  domain: "[('folder_id', 'any', ['&', ('in_trash', '=', False), '|', ('eff_upload_user_ids', 'in', [user.id]), ('eff_upload_group_ids', 'in', user.groups_id.ids)])]"
- id: rule_woow_document_manager
  ref: R-D4
  model: woow.document
  groups: [manager]
  perms: '1111'
  domain: "[(1, '=', 1)]"
- id: rule_woow_document_portal_read
  ref: R-D5
  model: woow.document
  groups: [portal]
  perms: '1000'
  domain: "[('active', '=', True), ('folder_in_trash', '=', False), '|', ('folder_id', 'any', [('eff_read_partner_ids', 'in', [user.partner_id.id])]), ('shared_partner_ids', 'in', [user.partner_id.id])]"
- id: rule_woow_document_portal_create
  ref: R-D6
  model: woow.document
  groups: [portal]
  perms: '0010'
  domain: "[('folder_id', 'any', [('in_trash', '=', False), ('eff_upload_partner_ids', 'in', [user.partner_id.id])])]"
- id: rule_woow_document_tag_company
  ref: R-T0
  model: woow.document.tag
  groups: []
  perms: '1111'
  domain: "['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]"
- id: rule_woow_document_tag_user_read
  ref: R-T1
  model: woow.document.tag
  groups: [user]
  perms: '1000'
  domain: "[(1, '=', 1)]"
- id: rule_woow_document_share_company
  ref: R-S0
  model: woow.document.share
  groups: []
  perms: '1111'
  domain: "['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]"
- id: rule_woow_document_share_user_own
  ref: R-S1
  model: woow.document.share
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
- id: rule_woow_document_share_manager
  ref: R-S2
  model: woow.document.share
  groups: [manager]
  perms: '1111'
  domain: "[(1, '=', 1)]"
- id: rule_woow_document_log_company
  ref: R-L0
  model: woow.document.log
  groups: []
  perms: '1000'
  domain: "['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]"
- id: rule_woow_document_log_user_read
  ref: R-L1
  model: woow.document.log
  groups: [user]
  perms: '1000'
  domain: "['|', ('user_id', '=', user.id), ('share_id.create_uid', '=', user.id)]"
- id: rule_woow_document_log_manager
  ref: R-L2
  model: woow.document.log
  groups: [manager]
  perms: '1000'
  domain: "[(1, '=', 1)]"
# R-W1..R-W6: a wizard row is its creator's alone (core has no owner rule for transient models).
- id: rule_woow_document_share_wizard_owner
  ref: R-W1
  model: woow.document.share.wizard
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
- id: rule_woow_document_move_wizard_owner
  ref: R-W2
  model: woow.document.move.wizard
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
- id: rule_woow_document_restore_wizard_owner
  ref: R-W3
  model: woow.document.restore.wizard
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
- id: rule_woow_document_purge_wizard_owner
  ref: R-W4
  model: woow.document.purge.wizard
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
- id: rule_woow_document_add_attachment_wizard_owner
  ref: R-W5
  model: woow.document.add.attachment.wizard
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
- id: rule_woow_document_notify_wizard_owner
  ref: R-W6
  model: woow.document.notify.wizard
  groups: [user]
  perms: '1111'
  domain: "[('create_uid', '=', user.id)]"
# R-M0 is a global rule on a core model (mail.message): share users (portal / public) never
# read, write, create or unlink this module's chatter; internal users are unaffected (DEC-11).
- id: rule_woow_mail_message_share_users
  ref: R-M0
  model: mail.message
  groups: []
  perms: '1111'
  domain: "[(1, '=', 1)] if not user.share else [('model', 'not in', ['woow.document', 'woow.document.folder'])]"
