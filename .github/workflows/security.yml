# Security CI: the 8 static tools and their self-tests, semgrep (p/python, p/secrets) and gitleaks
# on the work tree and the full git history. Tool versions are pinned; a missing tool fails the job.
name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned semgrep and gitleaks
      env:
        SEMGREP_VERSION: 1.181.1
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -eu
        python3 -m venv "$RUNNER_TEMP/semgrep"
        "$RUNNER_TEMP/semgrep/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
        curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/bin"
        tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
        echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Static tools, self-tests, semgrep and gitleaks
      env:
        WOOW_REQUIRE_SEMGREP: "1"
      run: sh tools/run_all.sh
